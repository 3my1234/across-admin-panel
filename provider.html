<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ATL Xpres — use the app</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07110D;color:#F2FFF9;padding:24px;box-sizing:border-box}
  main{max-width:420px;text-align:center}
  h1{font-size:1.6rem;margin:0 0 12px}
  p{line-height:1.5;color:#C9E8DA}
  a{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:12px;background:#4EE0A8;color:#08251B;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>Your business is now in the ATL Xpres app</h1>
  <p>The provider web portal has closed. Products, services, jobs, chats, Town Hall and your subscription are all in the ATL Xpres mobile app. Sign in there with the same account.</p>
  <a href="https://atlxpres.com">Get the ATL Xpres app</a>
</main>
<script>
  // Remove the retired portal's offline copy from browsers that installed it.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (list) { list.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  if (window.caches) caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
</script>
</body>
</html>
