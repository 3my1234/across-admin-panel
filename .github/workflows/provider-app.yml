name: Provider app checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  provider-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check provider regressions
        run: |
          node --check settings.js
          node --check admin-analytics.js
          node --check admin-operations.js
          node --check app.20260927.js
          node --check private-chat-store.js
          node --check provider-map-loader.js
          node --check listing-images.js
          node --check provider.js
          node --check provider-pwa.js
          node --check provider-sw.js
          node --check provider-updates.js
          node --check provider-identity.js
          node --check community-portal.js
          node --check driver-availability.js
          node --check location-sharing.js
          node --check message-receipts.js
          node scripts/test-receipt-routing.cjs
          node scripts/test-location-sharing.cjs
          node --check provider-native.js
          node --check service-categories.js
          node scripts/test-launch-forms.cjs
          node scripts/test-provider-native.cjs
          node --check community-town-hall.js
          node --check community-admin.js
          node scripts/test-provider-badges.cjs
          node scripts/test-provider-access.cjs
          node scripts/test-theme.cjs
          node scripts/test-plan-link-and-keyboard.cjs
          node scripts/test-provider-updates.cjs
          node scripts/test-listing-review.cjs
          node scripts/test-moderation-feedback.cjs
          node scripts/test-subscription-periods.cjs
          node scripts/test-provider-pwa.cjs
          node scripts/test-provider-support.cjs
          node scripts/test-support-device-cache.cjs
          node scripts/test-chat-unread.cjs
          node scripts/test-product-chat.cjs
          node scripts/test-page-refresh.cjs
          node scripts/test-catalog-live.cjs
      - name: Check Settings, encrypted cache and responsive chat in Chrome
        env:
          COMMUNITY_TEST_ORIGIN: http://127.0.0.1:5176
        run: |
          python3 -m http.server 5176 --bind 127.0.0.1 > /tmp/atl-web.log 2>&1 &
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9224 --user-data-dir=/tmp/atl-chat-chrome about:blank > /tmp/atl-chrome.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:9224/json > /dev/null && curl --silent --fail http://127.0.0.1:5176/provider.html > /dev/null; then break; fi
            sleep 0.25
          done
          node scripts/test-private-chat-browser.cjs
          node scripts/test-provider-browser.cjs
          node scripts/test-overview-browser.cjs
          node scripts/test-admin-providers-browser.cjs
          node scripts/test-admin-operations-browser.cjs
          node scripts/test-admin-analytics-browser.cjs
          node scripts/test-community-browser.cjs
          node scripts/test-launch-browser.cjs
          node scripts/test-hall-live-browser.cjs
          node scripts/test-provider-branding-browser.cjs
          node scripts/test-message-receipts-browser.cjs
      - name: Build and check separate provider image
        run: |
          docker build -f Dockerfile.provider -t provider-app:ci .
          docker run --rm provider-app:ci nginx -t
          docker run -d --name provider-app-ci -p 8080:8080 provider-app:ci
          sleep 2
          curl --fail http://127.0.0.1:8080/provider.html
          curl --fail http://127.0.0.1:8080/provider.webmanifest
          curl --fail http://127.0.0.1:8080/provider-overview.css --output /tmp/provider-overview.css
          curl --fail http://127.0.0.1:8080/provider-updates.js --output /tmp/provider-updates.js
          curl --fail http://127.0.0.1:8080/community-portal.js --output /tmp/community-portal.js
          curl --fail http://127.0.0.1:8080/provider-native.js --output /tmp/provider-native.js
          curl --fail http://127.0.0.1:8080/location-sharing.js --output /tmp/location-sharing.js
          curl --fail http://127.0.0.1:8080/driver-availability.js --output /tmp/driver-availability.js
          curl --fail http://127.0.0.1:8080/message-receipts.js --output /tmp/message-receipts.js
          curl --fail http://127.0.0.1:8080/message-receipts.css --output /tmp/message-receipts.css
          curl --fail http://127.0.0.1:8080/service-categories-data.js --output /tmp/service-categories-data.js
          curl --fail http://127.0.0.1:8080/hall-icon.js --output /tmp/hall-icon.js
          curl --fail http://127.0.0.1:8080/settings.js --output /tmp/settings.js
          curl --fail http://127.0.0.1:8080/private-chat-store.js --output /tmp/private-chat-store.js
          curl --fail http://127.0.0.1:8080/listing-images.js --output /tmp/listing-images.js
          curl --fail http://127.0.0.1:8080/town-hall.css --output /tmp/town-hall.css
          curl --fail http://127.0.0.1:8080/community-town-hall.js --output /tmp/community-town-hall.js
          curl --fail http://127.0.0.1:8080/provider-identity.js --output /tmp/provider-identity.js
          curl --fail http://127.0.0.1:8080/provider-identity.css --output /tmp/provider-identity.css
          curl --fail --head http://127.0.0.1:8080/provider.html | grep -i 'cache-control: no-cache'
          curl --fail http://127.0.0.1:8080/provider-background.png --output /tmp/provider-background.png
          test -s /tmp/provider-background.png
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/app.20260927.js)" = '404'
