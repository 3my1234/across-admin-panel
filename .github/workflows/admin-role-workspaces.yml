name: Admin role workspace checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  role-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check admin JavaScript
        run: |
          node --check app.20260927.js
          node --check admin-role-policy.js
          node --check admin-role-workspaces.js
          node --check settings.js
          node --check xp-withdrawals.js
      - name: Start isolated browser and frontend
        run: |
          python3 -m http.server 5178 --bind 127.0.0.1 >/tmp/admin-http.log 2>&1 &
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9227 --user-data-dir=/tmp/admin-role-browser about:blank >/tmp/admin-chrome.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9227/json >/dev/null && curl -fsS http://127.0.0.1:5178/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify all roles in actual admin page using synthetic API responses
        run: node scripts/test-admin-roles-browser.cjs
